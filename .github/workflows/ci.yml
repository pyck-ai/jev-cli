name: ci
run-name: CI

# Runs on every pull request and on every push to main or a release branch,
# so the required `ci-success` check always reports. Each job runs one
# Taskfile task; `task ci` runs the same three in sequence locally
# (pyck-ai/guidelines docs/ci.md).
on:
  pull_request:
  push:
    branches: [main, 'release/**']

# Cancel superseded runs for the same ref (PR head or main): nothing here
# publishes anything, so an in-flight run can always be safely replaced.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# No default token scope. Every job below declares exactly what it needs.
permissions: {}

# The self-hosted-kata runner has task, go and gcc (for `go test -race`)
# and no docker, which none of these tasks needs.
jobs:
  lint:
    permissions:
      contents: read
    runs-on: self-hosted-kata
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: task lint

  test:
    permissions:
      contents: read
    runs-on: self-hosted-kata
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: task test

  compile:
    permissions:
      contents: read
    runs-on: self-hosted-kata
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: task compile

  # The one check the org ruleset requires. Runs even when a job above
  # failed, and fails on any failed or cancelled job in `needs`. Add a job
  # above and its name here, nothing else.
  ci-success:
    if: always()
    needs: [lint, test, compile]
    permissions: {}
    runs-on: self-hosted-kata
    steps:
      - uses: pyck-ai/github-actions/gate@04c6f5cd724c6c65a2c2a613f4a97111bbf6347f # main 2026-10-15
        with:
          needs: ${{ toJSON(needs) }}

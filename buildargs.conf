# Build arguments for Docker Bake.
#
# Task sources this file via dotenv and forwards every variable to Bake as
# --set *.args.<KEY>=<VALUE>, making each entry available as a global Docker
# ARG in the Dockerfile.
#
# Both entries are floating tags ON PURPOSE: freshness comes from the scheduled
# rebuild, which pulls the base images again (--pull), not from pinning a digest
# or version here. Nothing in this file is managed by Renovate.
#
# The shared build-image workflow requires this file to exist and to hold at
# least one non-comment KEY=VALUE line (it greps them under `-eo pipefail`).
GOLANG_IMAGE=ghcr.io/pyck-ai/baseimages/golang:alpine
RUNTIME_IMAGE=ghcr.io/pyck-ai/baseimages/static:latest
